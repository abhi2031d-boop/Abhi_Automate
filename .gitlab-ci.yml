image: python:3.12

stages:
  - test

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pytest --version

selenium_tests:
  stage: test
  script:
    - mkdir -p reports
    - pytest tests --html=reports/report.html --self-contained-html
  artifacts:
    when: always
    paths:
      - reports/